id: AW-003
title: Agent read credential or key material from disk
severity: high
status: experimental
description: >
  Agents in this fleet work inside ./workspace and ./src. Reading cloud credentials, SSH keys,
  kubeconfig, or .env files is outside every role's baseline.
mitre_attack: [T1552.001]          # Unsecured Credentials: Credentials In Files
mitre_atlas: []
response: [revoke_token]
query: |
  SELECT
      agent_id,
      any(session_id)           AS session_id,
      min(ts)                   AS first_seen,
      max(ts)                   AS last_seen,
      count()                   AS hits,
      groupUniqArray(target)    AS evidence
  FROM agent_events
  WHERE action_type = 'file_read'
    AND outcome = 'allowed'
    AND match(target, '(\\.aws/credentials|\\.ssh/id_|(^|/)\\.env$|\\.kube/config|\\.netrc|\\.git-credentials)')
  GROUP BY agent_id
tests:
  must_fire_on: [agent-0135]
  must_not_fire_on: [agent-0003, agent-0004, agent-0210]
